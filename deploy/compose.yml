name: everbloom-beta

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: everbloom
      POSTGRES_USER: everbloom_admin
      POSTGRES_PASSWORD: ${EVERBLOOM_POSTGRES_ADMIN_PASSWORD:?Set the database administrator password}
      EVERBLOOM_DB_PASSWORD: ${EVERBLOOM_DB_PASSWORD:?Set the application database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 128mb
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

  backend:
    image: everbloom-backend:${EVERBLOOM_RELEASE:-local-beta}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      EVERBLOOM_BIND_ADDRESS: 0.0.0.0
      EVERBLOOM_PORT: 8080
      EVERBLOOM_DB_URL: jdbc:postgresql://db:5432/everbloom
      EVERBLOOM_DB_USER: everbloom
      EVERBLOOM_DB_PASSWORD: ${EVERBLOOM_DB_PASSWORD:?Set the application database password}
      EVERBLOOM_PUBLIC_BASE_URL: ${EVERBLOOM_PUBLIC_BASE_URL:?Set the public HTTPS origin}
      EVERBLOOM_TRUSTED_PROXY_IPS: ${EVERBLOOM_CADDY_INTERNAL_IP:-172.30.73.2}
      EVERBLOOM_SMTP_HOST: ${EVERBLOOM_SMTP_HOST:?Set the SMTP server}
      EVERBLOOM_SMTP_PORT: ${EVERBLOOM_SMTP_PORT:-587}
      EVERBLOOM_SMTP_USER: ${EVERBLOOM_SMTP_USER:?Set the SMTP username}
      EVERBLOOM_SMTP_PASSWORD: ${EVERBLOOM_SMTP_PASSWORD:?Set the SMTP password}
      EVERBLOOM_MAIL_FROM: ${EVERBLOOM_MAIL_FROM:?Set the sender address}
      EVERBLOOM_BILLING_MODE: ${EVERBLOOM_BILLING_MODE:-preview}
      REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:-}
      REVENUECAT_WEBHOOK_AUTHORIZATION: ${REVENUECAT_WEBHOOK_AUTHORIZATION:-}
      REVENUECAT_APPLE_API_KEY: ${REVENUECAT_APPLE_API_KEY:-}
      REVENUECAT_GOOGLE_API_KEY: ${REVENUECAT_GOOGLE_API_KEY:-}
      REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-everbloom_plus}
      REVENUECAT_APPLE_PRODUCT_ID: ${REVENUECAT_APPLE_PRODUCT_ID:-everbloom_plus_monthly}
      REVENUECAT_GOOGLE_PRODUCT_ID: ${REVENUECAT_GOOGLE_PRODUCT_ID:-everbloom_plus:monthly}
      REVENUECAT_OFFERING_ID: ${REVENUECAT_OFFERING_ID:-default}
      REVENUECAT_ALLOW_SANDBOX: ${REVENUECAT_ALLOW_SANDBOX:-false}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, database]
    expose: ['8080']
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, '4', http://127.0.0.1:8080/api/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  web:
    image: everbloom-web:${EVERBLOOM_RELEASE:-local-beta}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    environment:
      EVERBLOOM_DOMAIN: ${EVERBLOOM_DOMAIN:?Set the public hostname}
      EVERBLOOM_ACME_EMAIL: ${EVERBLOOM_ACME_EMAIL:?Set an ACME contact address}
    depends_on:
      backend:
        condition: service_healthy
    ports: ['80:80', '443:443', '443:443/udp']
    networks:
      edge:
        ipv4_address: ${EVERBLOOM_CADDY_INTERNAL_IP:-172.30.73.2}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8081/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    cpus: 0.5
    logging: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: ${EVERBLOOM_EDGE_SUBNET:-172.30.73.0/24}
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
