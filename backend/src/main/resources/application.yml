spring:
  application:
    name: everbloom
  datasource:
    url: ${EVERBLOOM_DB_URL:jdbc:postgresql://127.0.0.1:5432/everbloom}
    username: ${EVERBLOOM_DB_USER:everbloom}
    password: ${EVERBLOOM_DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${EVERBLOOM_BIND_ADDRESS:127.0.0.1}
  port: ${EVERBLOOM_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: EVERBLOOM_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  game:
    zone: Europe/Vienna
  auth:
    login-limit: 15
    register-limit: 5
    window-seconds: 900
    max-rate-keys: 10000
